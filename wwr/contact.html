<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Get in touch with White Water Rafting Adventures for bookings, inquiries, and trip information. Our team is ready to help you plan an unforgettable rafting experience with expert guides, safe equipment, and thrilling river routes. Contact us today!">
    <meta name="author" content="Ani Ijeoma">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>White Water Rafting: Contact us</title>
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="container">

            <h1>White Water Rafting Company</h1>
            <p class="contact-info">
                123 Main River Street <br>
                Kolob, California <br>
                +1 999 999 9999 <br>
                info@whitewater.com
            </p>

            <div class="content-wrapper">

                <!-- Map Placeholder -->
                <div class="map-box">
                    <div class="map-placeholder">
                        <iframe class="iframe"
                            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3232657.556080127!2d-119.36289798363799!3d37.69873196271808!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1764266555371!5m2!1sen!2sng"
                            width="600" height="450" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>

                <!-- Contact Form -->
                <form class="contact-form">
                    <label>Name</label>
                    <input type="text" placeholder="Placeholder">

                    <label>Email</label>
                    <input type="email" placeholder="Placeholder">

                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" checked> General Inquiry</label>
                        <label><input type="radio" name="purpose"> Reservation Question</label>
                        <label><input type="radio" name="purpose"> Website Suggestion</label>
                    </div>

                    <label>Message</label>
                    <textarea placeholder="Type here."></textarea>

                    <label class="checkbox">
                        <input type="checkbox">
                        Please Subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>

            </div>
        </div>

    </main>
    <footer>
        <p> &copy; 2025 White Water Rafting | Ijeoma Ani</p>
        <nav class="socialmedia ">
            <a href="https://www.facebook.com"><img src="images/facebook.png" alt="facebook Icon"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.png" alt="instagram icon"></a>
            <a href="https://www.youtube.com"><img src="images/youtube.png" alt="youtube icon"></a>
        </nav>
    </footer>

</body>

</html>
